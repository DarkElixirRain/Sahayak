[api]
host = "0.0.0.0"
port = 8000
reload = true

[service]
environment = "development"  # "development", "staging", or "production"
version = "unknown"
enable_profiling = false  # Enable request profiling (creates .prof files in logs/)

[auth]
jwt_algorithm = "HS256"
bypass_auth_mode = true  # Enabled by default for easier local development
dev_user_id = "dev_user"  # Default dev user ID

#### Registered models
[registered_models]
# OpenAI models (commented out - not being used)
# openai_gpt4-1 = { model_name = "gpt-4.1" }
# openai_gpt4-1-mini = { model_name = "gpt-4.1-mini" }

# Azure OpenAI models (commented out - not being used)
# azure_gpt4 = { model_name = "gpt-4", api_base = "YOUR_AZURE_URL_HERE", api_version = "2023-05-15", deployment_id = "gpt-4-deployment" }
# azure_gpt35 = { model_name = "gpt-3.5-turbo", api_base = "YOUR_AZURE_URL_HERE", api_version = "2023-05-15", deployment_id = "gpt-35-turbo-deployment" }

# Anthropic models (commented out - not being used)
# claude_opus = { model_name = "claude-3-opus-20240229" }
# claude_sonnet = { model_name = "claude-3-7-sonnet-latest" }

# Google Gemini models - ACTIVE (better for Nepali language)
# Direct Gemini API implementation (bypasses LiteLLM)
# Uses GOOGLE_API_KEY or GEMINI_API_KEY from environment
gemini_flash_direct = { model_name = "gemini-3.6-flash", provider = "gemini_direct" }
gemini_pro_direct = { model_name = "gemini-3.6-pro", provider = "gemini_direct" }

# Groq models
groq_llama = { model_name = "groq/qwen/qwen3.8-27b" }

# Ollama models (modify api_base based on your deployment)
# - Local Ollama: "http://localhost:11434" (default)
# - Morphik in Docker, Ollama local: "http://host.docker.internal:11434"
# - Both in Docker: "http://ollama:11434"

# Your available Ollama models
ollama_qwen_vision = { model_name = "ollama_chat/qwen2.5:7b", api_base = "http://localhost:11434" }
ollama_llama = { model_name = "ollama_chat/llama3.2:latest", api_base = "http://localhost:11434" }
ollama_embedding = { model_name = "nomic-embed-text", api_base = "http://localhost:11434", provider = "ollama_direct" }

# Lemonade models (commented out - not being used)
